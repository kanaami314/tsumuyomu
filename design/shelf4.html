  .glow{position:absolute;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:1600px;height:360px;pointer-events:none;background:radial-gradient(ellipse 58% 70% at 22% 42%,rgba(247,241,229,.9) 0%,rgba(247,241,229,.66) 48%,rgba(247,241,229,0) 100%),radial-gradient(ellipse 40% 30% at 85% 4%,rgba(247,241,229,.8) 0%,rgba(247,241,229,0) 100%)}
  .page{position:relative;max-width:920px;margin:0 auto;padding:0 20px 56px}
  .nav{display:flex;justify-content:space-between;align-items:center;padding:20px 4px}
  .logo{font-size:19px;font-weight:600;color:var(--green)}
  .menu{display:flex;gap:6px;font-size:13px;color:#4A5E50}
  .menu span{padding:7px 14px;border-radius:999px}
  .menu .on{background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--green)}
  .profile{display:flex;align-items:flex-start;gap:16px;padding:36px 4px 0;height:230px;flex-wrap:wrap;align-content:flex-start}
  .avatar{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.7);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
  .pname{font-size:22px;font-weight:600;color:#2B3A2F}
  .pbio{font-size:13.5px;color:#46604F;margin-top:3px}
  .counts{width:100%;display:flex;gap:26px;margin-top:18px}
  .counts b{display:block;font-size:34px;line-height:1.1;color:var(--green);font-weight:600}
  .counts small{font-size:12.5px;color:#46604F}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 4px 20px}
  .chip{padding:6px 14px;border-radius:999px;font-size:13px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--green)}

<body>
<div class="photo"></div>
<div class="glow"></div>
<div class="page">

  </div>
  <div class="profile">
    <div class="avatar"><i class="ti ti-user"></i></div>
    <div><div class="pname">わたしの書棚</div><div class="pbio">毎日1本、ゆっくり読んでいます。</div></div>
    <div class="counts">

  <div class="case"><div class="back" id="shelf"></div></div>

</div>
<script>
  var P={ml:"#5F86A3",ls:"#7FA88B",ps:"#D2A64D",li:"#A57FA4",ne:"#CC8268",ed:"#D49A9A",st:"#5E9A98",ma:"#7C8FA0"};
  var books=[
    {t:"Attention Is All You Need",s:"Attention Is All You Need",a:"Vaswani ほか",y:2017,g:"ml",face:1},
    {t:"The Spacing Effect in Learning",s:"The Spacing Effect",a:"Cepeda ほか",y:2006,g:"ls"},
    {t:"Habit formation in everyday life",s:"Habit formation",a:"Lally ほか",y:2010,g:"ps",face:1},
    {t:"Statistical learning by infants",s:"Statistical learning",a:"Saffran ほか",y:1996,g:"li"},
    {t:"Sleep and memory consolidation",s:"Sleep and memory",a:"Diekelmann ほか",y:2013,g:"ne"},
    {t:"Deep residual learning",s:"Deep residual learning",a:"He ほか",y:2016,g:"ml"},
    {t:"The Magical Number Seven",s:"Magical Number Seven",a:"Miller",y:1956,g:"ps"},
    {t:"Grit: perseverance and passion",s:"Grit",a:"Duckworth ほか",y:2007,g:"ps"},
    {t:"BERT: pre-training of transformers",s:"BERT",a:"Devlin ほか",y:2019,g:"ml"},
    {t:"Testing effect and retention",s:"Testing effect",a:"Roediger ほか",y:2006,g:"ed",face:1},
    {t:"Flow in daily experience",s:"Flow",a:"Csikszentmihalyi",y:1990,g:"ps"},
    {t:"Dropout",s:"Dropout",a:"Srivastava ほか",y:2014,g:"ml"},
    {t:"Adam: a method for stochastic optimization",s:"Adam",a:"Kingma ほか",y:2015,g:"ml"},
    {t:"Generative adversarial nets",s:"GAN",a:"Goodfellow ほか",y:2014,g:"ml"},
    {t:"Prospect theory",s:"Prospect theory",a:"Kahneman ほか",y:1979,g:"ps",face:1},
    {t:"Self-determination theory",s:"Self-determination",a:"Deci ほか",y:2000,g:"ed"},
    {t:"Mastering the game of Go",s:"Mastering Go",a:"Silver ほか",y:2016,g:"ml"},
    {t:"Mirror neurons",s:"Mirror neurons",a:"Rizzolatti ほか",y:2004,g:"ne"},
    {t:"Working memory",s:"Working memory",a:"Baddeley",y:1992,g:"ne"},
    {t:"Mindset and learning",s:"Mindset",a:"Dweck ほか",y:2007,g:"ed"},
    {t:"Bayesian data analysis",s:"Bayesian data analysis",a:"Gelman ほか",y:2013,g:"st"},
    {t:"Language and thought",s:"Language and thought",a:"Boroditsky",y:2001,g:"li"},
    {t:"Reading comprehension",s:"Reading comprehension",a:"Kintsch",y:1988,g:"li"},
    {t:"Graph theory basics",s:"Graph theory basics",a:"Bondy ほか",y:1976,g:"ma"}
  ];
  function hash(i){return (i*2654435761>>>0)%1000}
  function shade(hex,p){var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
    function f(c){return Math.max(0,Math.min(255,Math.round(p>0?c+(255-c)*p:c*(1+p))))}
    function h2(c){c=f(c).toString(16);return c.length<2?"0"+c:c}
    return "#"+h2(r)+h2(g)+h2(b)}
  function ink(hex){var n=parseInt(hex.slice(1),16),l=0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255);return l>150?"#2A2418":"#fff"}
  function build(b,i){
    var base=P[b.g],h=hash(i),bg=shade(base,((h%9)-4)*0.03),fg=ink(bg);
    if(b.face){
      return {w:123,html:'<div class="face" style="background:'+bg+';color:'+fg+'"><span class="rb" style="background:'+shade(base,-0.38)+'"></span><div class="bt">'+b.t+'</div><div class="ln"></div><div class="au">'+b.a+'　'+b.y+'</div></div>'};
    }
    var w=27+h%15,ht=140+(h%5)*9;
    return {w:w+3,html:'<div class="sp" title="'+b.t+'" style="width:'+w+'px;height:'+ht+'px;background:'+bg+';color:'+fg+'"><span class="t">'+b.s+'</span><span class="y">'+b.y+'</span></div>'};
  }
  function render(){
    var box=document.getElementById('shelf');
    var avail=box.clientWidth-44;
    var items=books.map(build);
    items.push({w:47,html:'<div class="add-book"><i class="ti ti-plus"></i></div>'});
    var rows=[],cur=[],used=0;
    items.forEach(function(it){
      if(used+it.w>avail&&cur.length){rows.push(cur);cur=[];used=0}
      cur.push(it.html);used+=it.w;
    });
    if(cur.length)rows.push(cur);
    var html='';
    rows.forEach(function(r,k){
      html+='<div class="tier"><div class="row">'+r.join('')+'</div></div><div class="plank p'+(k%3)+'"></div>';
    });
    box.innerHTML=html;
  }
  render();window.addEventListener('resize',render);
</script>
